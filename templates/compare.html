<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nepali Model Comparison</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f5f7;
            color: #202124;
        }
        .container {
            max-width: 1000px;
            margin: 24px auto;
            padding: 0 16px 24px;
        }
        h1 {
            margin-bottom: 8px;
            font-size: 28px;
        }
        p.description {
            margin: 0 0 20px;
            color: #5f6368;
        }
        .panel {
            background: #fff;
            border: 1px solid #dfe1e5;
            border-radius: 14px;
            box-shadow: 0 1px 3px rgba(60,64,67,.15);
            overflow: hidden;
        }
        .panel header {
            padding: 18px 20px;
            border-bottom: 1px solid #e8eaed;
            background: #fafafb;
        }
        .panel header h2 {
            margin: 0;
            font-size: 18px;
        }
        .panel-body {
            padding: 18px 20px;
        }
        textarea {
            width: 100%;
            min-height: 120px;
            border: 1px solid #dfe1e5;
            border-radius: 10px;
            padding: 14px;
            font-size: 16px;
            resize: vertical;
            font-family: inherit;
            color: #202124;
            background: #fff;
        }
        .outputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .outputs textarea {
            min-height: 170px;
        }
        .actions {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            border: 1px solid #dfe1e5;
            background: #fff;
            color: #202124;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: background .2s, border-color .2s;
        }
        .btn.primary {
            background: #1a73e8;
            color: #fff;
            border-color: #1a73e8;
        }
        .btn:hover {
            background: #f1f3f4;
        }
        .btn.primary:hover {
            background: #165abc;
        }
        .status {
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 10px;
            display: none;
        }
        .status.success {
            display: block;
            background: #e6f4ea;
            color: #137333;
            border: 1px solid #b7dfbf;
        }
        .status.error {
            display: block;
            background: #fce8e6;
            color: #b3261e;
            border: 1px solid #f2b8b5;
        }
        @media (max-width: 800px) {
            .outputs {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nepali Model Comparison</h1>
        <p class="description">Enter an English sentence and compare the output of your fine-tuned model against the baseline NLLB Nepali model.</p>

        <div class="panel">
            <header><h2>Input</h2></header>
            <div class="panel-body">
                <textarea id="inputText" placeholder="Type English text here..."></textarea>
                <div class="actions">
                    <button class="btn primary" id="translateBtn">Translate</button>
                    <button class="btn" id="clearBtn">Clear</button>
                    <button class="btn" id="copyBtn">Copy Trained Output</button>
                </div>
                <div class="status" id="status"></div>
            </div>
        </div>

        <div class="outputs">
            <div class="panel">
                <header><h2>Fine-tuned Model</h2></header>
                <div class="panel-body">
                    <textarea id="trainedOutput" disabled placeholder="Fine-tuned Nepali output"></textarea>
                </div>
            </div>
            <div class="panel">
                <header><h2>Baseline NLLB Model</h2></header>
                <div class="panel-body">
                    <textarea id="baselineOutput" disabled placeholder="Baseline Nepali output"></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inputText = document.getElementById('inputText');
        const trainedOutput = document.getElementById('trainedOutput');
        const baselineOutput = document.getElementById('baselineOutput');
        const translateBtn = document.getElementById('translateBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const statusDiv = document.getElementById('status');

        async function translateText() {
            const text = inputText.value.trim();
            if (!text) {
                showStatus('Please enter English text first.', 'error');
                return;
            }

            translateBtn.disabled = true;
            showStatus('Translating…', 'success');
            trainedOutput.value = '';
            baselineOutput.value = '';

            try {
                const response = await fetch('/api/compare', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({text})
                });
                const data = await response.json();
                if (!data.success) {
                    showStatus(data.error || 'Translation failed.', 'error');
                } else {
                    trainedOutput.value = data.trained_translation || '';
                    baselineOutput.value = data.baseline_translation || '';
                    showStatus('Translation complete.', 'success');
                }
            } catch (error) {
                console.error(error);
                showStatus('Network error during translation.', 'error');
            } finally {
                translateBtn.disabled = false;
            }
        }

        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }

        translateBtn.addEventListener('click', translateText);
        clearBtn.addEventListener('click', () => {
            inputText.value = '';
            trainedOutput.value = '';
            baselineOutput.value = '';
            statusDiv.textContent = '';
            statusDiv.className = 'status';
        });
        copyBtn.addEventListener('click', async () => {
            if (!trainedOutput.value) {
                showStatus('Nothing to copy from fine-tuned output.', 'error');
                return;
            }
            try {
                await navigator.clipboard.writeText(trainedOutput.value);
                showStatus('Copied trained output.', 'success');
            } catch (err) {
                console.error(err);
                showStatus('Unable to copy.', 'error');
            }
        });
        inputText.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                translateText();
            }
        });
    </script>
</body>
</html>
